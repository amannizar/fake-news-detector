{% extends "base.html" %}
{% block title %}Login — FakeGuard{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card glass-card">
        <div class="auth-header">
            <div class="auth-icon">🔐</div>
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Sign in to detect fake news</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form" id="login-form">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" name="username" class="form-input"
                           placeholder="Enter your username" required autocomplete="username"
                           autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" name="password" class="form-input"
                           placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" class="toggle-password" onclick="togglePassword('password')" aria-label="Toggle password visibility">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="login-btn">
                <span class="btn-text">Sign In</span>
                <span class="btn-loader" style="display:none"></span>
            </button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('register') }}" class="auth-link">Create one</a></p>
        </div>
    </div>

    <div class="auth-decoration">
        <div class="decoration-orb orb-1"></div>
        <div class="decoration-orb orb-2"></div>
        <div class="decoration-orb orb-3"></div>
    </div>
</div>
{% endblock %}
